dv:
  network: /hkustgz
  router: /hkustgz/core2
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.1.49:6363"  # Neighbor: core0
    - uri: "udp://172.16.1.61:6363"  # Neighbor: core1
    - uri: "udp://172.16.1.74:6363"  # Neighbor: core3
    - uri: "udp://172.16.1.78:6363"  # Neighbor: core4
    - uri: "udp://172.16.0.141:6363" # Neighbor: edge10
    - uri: "udp://172.16.0.145:6363" # Neighbor: edge11
    - uri: "udp://172.16.0.149:6363" # Neighbor: edge12
    - uri: "udp://172.16.0.153:6363" # Neighbor: edge13
    - uri: "udp://172.16.0.157:6363" # Neighbor: edge14
    - uri: "udp://172.16.0.209:6363" # Neighbor: con0
    - uri: "udp://172.16.0.229:6363" # Neighbor: con1
    - uri: "udp://172.16.0.249:6363" # Neighbor: con2
    - uri: "udp://172.16.1.13:6363"  # Neighbor: con3
    - uri: "udp://172.16.1.33:6363"  # Neighbor: con4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 16
    strategy_node_name: core2