dv:
  network: /hkustgz
  router: /hkustgz/edge23
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.93:6363"  # Neighbor: pro23
    - uri: "udp://172.16.0.194:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 32
    strategy_node_name: edge23