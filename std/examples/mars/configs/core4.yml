dv:
  network: /hkustgz
  router: /hkustgz/core4
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.137:6363" # Neighbor: con0
    - uri: "udp://172.16.0.157:6363" # Neighbor: con1
    - uri: "udp://172.16.0.177:6363" # Neighbor: con2
    - uri: "udp://172.16.0.193:6363" # Neighbor: core0
    - uri: "udp://172.16.0.205:6363" # Neighbor: core1
    - uri: "udp://172.16.0.213:6363" # Neighbor: core2
    - uri: "udp://172.16.0.217:6363" # Neighbor: core3
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: INFO
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 4
    strategy_node_name: core4
