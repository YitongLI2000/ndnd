dv:
  network: /hkustgz
  router: /hkustgz/core0
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.61:6363" # Neighbor: edge0
    - uri: "udp://172.16.0.65:6363" # Neighbor: edge1
    - uri: "udp://172.16.0.69:6363" # Neighbor: edge2
    - uri: "udp://172.16.0.73:6363" # Neighbor: edge3
    - uri: "udp://172.16.0.77:6363" # Neighbor: edge4
    - uri: "udp://172.16.0.121:6363" # Neighbor: con0
    - uri: "udp://172.16.0.141:6363" # Neighbor: con1
    - uri: "udp://172.16.0.161:6363" # Neighbor: con2
    - uri: "udp://172.16.0.182:6363" # Neighbor: core1
    - uri: "udp://172.16.0.186:6363" # Neighbor: core2
    - uri: "udp://172.16.0.190:6363" # Neighbor: core3
    - uri: "udp://172.16.0.194:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: INFO
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 32
    strategy_node_name: core0
