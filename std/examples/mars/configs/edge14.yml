dv:
  network: /hkustgz
  router: /hkustgz/edge14
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.57:6363" # Neighbor: pro14
    - uri: "udp://172.16.0.118:6363" # Neighbor: core2
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 64
    strategy_node_name: edge14