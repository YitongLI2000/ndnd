dv:
  network: /hkustgz
  router: /hkustgz/core3
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.133:6363" # Neighbor: con0
    - uri: "udp://172.16.0.153:6363" # Neighbor: con1
    - uri: "udp://172.16.0.173:6363" # Neighbor: con2
    - uri: "udp://172.16.0.189:6363" # Neighbor: core0
    - uri: "udp://172.16.0.201:6363" # Neighbor: core1
    - uri: "udp://172.16.0.209:6363" # Neighbor: core2
    - uri: "udp://172.16.0.218:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    # log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 32
    strategy_node_name: core3