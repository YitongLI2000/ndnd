dv:
  network: /hkustgz
  router: /hkustgz/con0
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.122:6363" # Neighbor: core0
    - uri: "udp://172.16.0.126:6363" # Neighbor: core1
    - uri: "udp://172.16.0.130:6363" # Neighbor: core2
    - uri: "udp://172.16.0.134:6363" # Neighbor: core3
    - uri: "udp://172.16.0.138:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    # log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 32
    strategy_node_name: con0