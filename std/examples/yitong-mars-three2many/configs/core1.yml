dv:
  network: /hkustgz
  router: /hkustgz/core1
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.81:6363" # Neighbor: edge5
    - uri: "udp://172.16.0.85:6363" # Neighbor: edge6
    - uri: "udp://172.16.0.89:6363" # Neighbor: edge7
    - uri: "udp://172.16.0.93:6363" # Neighbor: edge8
    - uri: "udp://172.16.0.97:6363" # Neighbor: edge9
    - uri: "udp://172.16.0.125:6363" # Neighbor: con0
    - uri: "udp://172.16.0.145:6363" # Neighbor: con1
    - uri: "udp://172.16.0.165:6363" # Neighbor: con2
    - uri: "udp://172.16.0.181:6363" # Neighbor: core0
    - uri: "udp://172.16.0.198:6363" # Neighbor: core2
    - uri: "udp://172.16.0.202:6363" # Neighbor: core3
    - uri: "udp://172.16.0.206:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    # log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 64
    strategy_node_name: core1