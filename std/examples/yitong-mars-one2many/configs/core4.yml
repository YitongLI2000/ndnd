dv:
  network: /hkustgz
  router: /hkustgz/core4
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.57:6363" # Neighbor: con0
    - uri: "udp://172.16.0.73:6363" # Neighbor: core0
    - uri: "udp://172.16.0.85:6363" # Neighbor: core1
    - uri: "udp://172.16.0.93:6363" # Neighbor: core2
    - uri: "udp://172.16.0.97:6363" # Neighbor: core3
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 16
    strategy_node_name: core4