dv:
  network: /hkustgz
  router: /hkustgz/core0
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.41:6363" # Neighbor: con0
    - uri: "udp://172.16.0.21:6363" # Neighbor: edge0
    - uri: "udp://172.16.0.25:6363" # Neighbor: edge1
    - uri: "udp://172.16.0.29:6363" # Neighbor: edge2
    - uri: "udp://172.16.0.33:6363" # Neighbor: edge3
    - uri: "udp://172.16.0.37:6363" # Neighbor: edge4
    - uri: "udp://172.16.0.62:6363" # Neighbor: core1
    - uri: "udp://172.16.0.66:6363" # Neighbor: core2
    - uri: "udp://172.16.0.70:6363" # Neighbor: core3
    - uri: "udp://172.16.0.74:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 16
    strategy_node_name: core0