dv:
  network: /hkustgz
  router: /hkustgz/core1
  keychain: "insecure"
  neighbors:
    - uri: "udp://172.16.0.45:6363" # Neighbor: con0
    - uri: "udp://172.16.0.61:6363" # Neighbor: core0
    - uri: "udp://172.16.0.78:6363" # Neighbor: core2
    - uri: "udp://172.16.0.82:6363" # Neighbor: core3
    - uri: "udp://172.16.0.86:6363" # Neighbor: core4
  advertise_interval: 1000
  router_dead_interval: 300000

fw:
  core:
    log_level: DEBUG
  faces:
    udp:
      enabled_unicast: true
      enabled_multicast: false
      port_unicast: 6363
      # default_mtu: 1420
    tcp:
      enabled: true
      port_unicast: 6363
    websocket:
      enabled: false
  fw:
    threads: 16
    strategy_node_name: core1